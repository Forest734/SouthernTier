# Tests and deploys public/ to GitHub Pages on every push to main, and when
# run by hand from the Actions tab.
# Needs Settings → Pages → Build and deployment → Source set to "GitHub Actions".
#
# The data in public/ is built locally by build_web.py (it needs the gigabyte rasters
# in data/, which aren't in git), so this only tests and uploads.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer run waits instead of cancelling one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
